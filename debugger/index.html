<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀 디버거 · 모임이 아닌, "팀"</title>
<style>
  :root {
    --bg: #0f172a; --panel: #111827; --card: #1f2937; --ink: #e5e7eb; --muted: #94a3b8; --line: #334155;
    --accent: #facc15;
    --purpose: #60a5fa; --commitment: #fb923c; --rules: #a78bfa; --interdependence: #34d399;
    --good: #22c55e; --bad: #ef4444; --chatbg: #b9cbdc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; background: #020617; color: var(--ink); display: flex; justify-content: center; }
  .app { width: 100%; max-width: 480px; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }

  header { padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .hrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  header h1 { font-size: 15px; margin: 0; }
  .stats { display: flex; gap: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); }
  .found { display: flex; gap: 6px; margin-top: 8px; }
  .found span { flex: 1; font-size: 11px; text-align: center; padding: 4px 0; border-radius: 6px; border: 1px dashed var(--line); color: var(--muted); }
  .found span.on { border-style: solid; color: #0b1220; font-weight: 700; }

  nav.tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--panel); }
  nav.tabs button { flex: 1; font: inherit; font-size: 13px; padding: 10px 0; background: none; border: 0; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
  nav.tabs button.pulse { animation: pulse 1s ease 3; }
  @keyframes pulse { 50% { background: rgba(250,204,21,.18); } }

  .stage { flex: 1; position: relative; min-height: 0; }
  main { position: absolute; inset: 0; overflow-y: auto; }
  .view { display: none; padding: 12px; }
  .view.on { display: block; }

  /* 제출 파일 + 슬라이드 */
  .file { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; cursor: pointer; }
  .file .f { display: inline-block; margin: 2px 6px 2px 0; padding: 2px 6px; background: #0b1220; border-radius: 4px; }
  .sv { position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: #fff; color: #111827; cursor: crosshair; }
  .sv .hd { height: 17%; display: flex; align-items: center; padding: 0 12px; font-size: 15px; font-weight: 800; color: #fff; background: #1d4ed8; }
  .sv .bd { padding: 10px 14px; font-size: 14px; line-height: 1.5; }
  .sv .who { position: absolute; right: 8px; bottom: 6px; font-size: 10px; color: #6b7280; pointer-events: none; }
  .sv.tpl-b { background: #14532d; color: #f0fdf4; font-family: "Times New Roman", Georgia, serif; }
  .sv.tpl-b .hd { background: transparent; color: #fef08a; font-style: italic; font-weight: 400; font-size: 18px; border-bottom: 1px solid #86efac; }
  .sv.tpl-b .who { color: #bbf7d0; }
  .sv.cover { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: linear-gradient(135deg,#1e3a8a,#2563eb); color: #fff; padding: 10px; }
  .sv.cover .t { font-size: 20px; font-weight: 800; line-height: 1.3; padding: 2px 6px; }
  .sv.cover .g { margin-top: 10px; font-size: 12px; background: rgba(255,255,255,.18); padding: 4px 8px; border-radius: 6px; }
  .sv.cover .who { color: #c7d2fe; }
  .sv.qa { background: #0b1220; color: #e5e7eb; }
  .sv.qa .hd { background: #334155; }
  .sv.qa .bd { font-size: 13px; }
  .sv.qa .q { margin: 4px 0; padding: 2px 4px; border-radius: 4px; }
  .sv .big { font-size: 34px; font-weight: 800; color: #1d4ed8; margin: 8px 0 2px; display: inline-block; padding: 0 4px; }
  .sv .src { font-size: 11px; color: #6b7280; margin: 2px 0; display: inline-block; }
  .sv.tpl-b .src { color: #bbf7d0; }
  .sv ul { margin: 4px 0; padding: 2px 4px 2px 20px; display: inline-block; }
  .sv .calc { font-size: 17px; margin: 14px 0 4px; display: inline-block; padding: 0 4px; }
  .sv .calc b { font-size: 22px; color: #047857; }
  .sv .ph { margin-top: 8px; height: 48%; border: 2px dashed #9ca3af; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #6b7280; font-size: 14px; }
  .sv .stamp { position: absolute; left: 50%; top: 66%; transform: translate(-50%,-50%) rotate(-8deg); border: 2px solid #9ca3af; color: #9ca3af; padding: 2px 10px; font-size: 13px; font-weight: 700; border-radius: 4px; background: rgba(255,255,255,.6); }
  .hot { outline: 2px dashed transparent; outline-offset: 2px; transition: outline-color .2s; cursor: pointer; }
  .hint-on .hot { outline-color: rgba(250,204,21,.8); }
  .hot.solved { outline: 2px solid var(--good) !important; }
  .speech { margin: 8px 2px 0; font-size: 13px; line-height: 1.5; color: #f3f4f6; min-height: 20px; }
  .speech b { color: #fde68a; }
  .controls { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .controls button { font: inherit; font-size: 13px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .controls .scene-no { flex: 1; text-align: center; font-size: 12px; color: var(--muted); }
  .thumbs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 8px; }
  .thumbs button { font: inherit; font-size: 11px; padding: 7px 0; border-radius: 6px; border: 2px solid transparent; background: var(--card); color: var(--ink); cursor: pointer; }
  .thumbs button[aria-current="true"] { border-color: var(--accent); }
  .tip { font-size: 12px; color: var(--muted); margin: 10px 2px; line-height: 1.5; }

  /* 단톡방 기록 */
  .log { background: var(--chatbg); border-radius: 10px; padding: 8px 10px 14px; color: #1f2933; }
  .log .day { text-align: center; margin: 12px 0 6px; }
  .log .day span { display: inline-block; font-size: 11px; background: rgba(0,0,0,.2); color: #fff; padding: 3px 10px; border-radius: 999px; }
  .log .sys { text-align: center; font-size: 11px; color: #4b5866; margin: 6px 0; padding: 2px 4px; border-radius: 6px; }
  .m { display: flex; gap: 7px; margin: 5px 0; align-items: flex-start; }
  .m.mine { justify-content: flex-end; }
  .av { flex: 0 0 28px; height: 28px; border-radius: 10px; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .m .nm { font-size: 11px; color: #3d4a57; margin: 0 0 2px 2px; }
  .bb { background: #fff; padding: 6px 10px; border-radius: 3px 12px 12px 12px; font-size: 13px; line-height: 1.45; max-width: 270px; word-break: keep-all; overflow-wrap: anywhere; }
  .m.mine .bb { background: #ffe14d; border-radius: 12px 3px 12px 12px; }
  .tracing .log .bb, .tracing .log .sys { cursor: pointer; }
  .tracing .log .bb:hover, .tracing .log .sys:hover { box-shadow: 0 0 0 2px #f59e0b; }
  .root { box-shadow: 0 0 0 2px var(--good) !important; }
  .nope { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  /* 사건 파일 */
  .case { background: var(--card); border-radius: 10px; padding: 12px; margin-bottom: 10px; border-left: 4px solid var(--line); font-size: 13px; line-height: 1.55; }
  .case h3 { margin: 0 0 6px; font-size: 14px; }
  .chain { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
  .chain div { background: #0b1220; border-radius: 6px; padding: 6px 8px; }
  .chain .arr { background: none; padding: 0 8px; color: var(--muted); font-size: 12px; }
  .empty-case { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 10px; }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 12px 14px; }
  .prompt { font-size: 13px; line-height: 1.5; min-height: 20px; }
  .prompt b { color: var(--accent); }
  .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 13px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
  .conds { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .conds button { font: inherit; font-size: 13px; padding: 10px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; text-align: left; }
  .conds button small { display: block; color: var(--muted); font-size: 11px; }

  .toast { position: fixed; left: 50%; bottom: 130px; transform: translateX(-50%); background: #111827; color: #fff; border: 1px solid var(--line); padding: 8px 14px; border-radius: 14px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; width: max-content; max-width: min(90%, 420px); text-align: center; z-index: 10; line-height: 1.45; }
  .toast.show { opacity: 1; }

  .overlay { position: absolute; inset: 0; background: var(--bg); padding: 18px 16px; overflow-y: auto; z-index: 5; }
  .overlay h2 { margin: 0 0 8px; font-size: 20px; }
  .overlay h3 { font-size: 15px; margin: 16px 0 6px; }
  .overlay p, .overlay li { font-size: 14px; line-height: 1.6; }
  .overlay .muted { color: var(--muted); font-size: 12px; }
  .bigstat { display: flex; gap: 10px; margin: 10px 0; }
  .bigstat div { flex: 1; background: var(--card); border-radius: 10px; padding: 10px; text-align: center; }
  .bigstat b { display: block; font-size: 20px; }
  .links li { margin: 8px 0; }

  /* ===== 데스크톱 데모 (GitHub Pages) ===== */
  .home { font-size: 12px; color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
  .home:hover { color: var(--ink); }
  .desk-h { display: none; }
  .fitbox { position: relative; }
  .fitbox .sv { width: 440px; transform-origin: 0 0; }
  @media (min-width: 1024px) {
    body { background: #0b1222; }
    .app { max-width: 1360px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
    header { padding: 12px 20px; display: flex; align-items: center; gap: 20px; }
    header .hrow { flex: 0 0 auto; gap: 18px; }
    header h1 { font-size: 17px; }
    .found { flex: 1; margin-top: 0; }
    .found span { font-size: 12px; padding: 6px 0; }
    nav.tabs { display: none; }
    main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(360px, 1fr); grid-template-rows: minmax(0, 1.55fr) minmax(0, 1fr); grid-template-areas: "result log" "case log"; overflow: hidden; }
    .view { display: block; overflow-y: auto; padding: 14px 20px; }
    #view-result { grid-area: result; }
    #view-log { grid-area: log; border-left: 1px solid var(--line); background: #0d1628; transition: box-shadow .3s; }
    #view-case { grid-area: case; border-top: 1px solid var(--line); }
    .fitbox { margin: 0 auto; }
    #view-result .tip { display: none; }
    .desk-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-weight: 800; margin: 0 0 10px; color: #cbd5e1; }
    .desk-h span { font-weight: 400; font-size: 12px; color: var(--muted); }
    .tracing #view-log { box-shadow: inset 0 0 0 3px #f59e0b; }
    #view-log.flash { animation: flash 1s ease 2; }
    @keyframes flash { 50% { background: #2a2410; } }
    .bb { max-width: 340px; font-size: 14px; }
    footer { padding: 12px 20px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .prompt { font-size: 15px; flex: 1 1 420px; }
    #actions { flex: 0 1 auto; }
    #actions .row, #actions .conds { margin-top: 0; }
    .conds { grid-template-columns: repeat(4, minmax(120px, 1fr)); }
    .toast { bottom: 110px; font-size: 14px; }
    .overlay { padding: 32px max(24px, calc(50% - 360px)); }
    .case { font-size: 13.5px; }
  }
  @media (min-width: 1200px) {
    main { grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr) minmax(280px, .8fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "result log case"; }
    #view-case { border-top: 0; border-left: 1px solid var(--line); }
  }
  header h1, .stats span { white-space: nowrap; }

  /* ===== 공통 테마 (세 페이지 동일): 흰 바탕, 남색 글자, 노란 형광펜 하나 ===== */
  :root {
    --bg: #f3f5f9; --panel: #ffffff; --card: #ffffff; --ink: #1b2a4a; --muted: #5b6680; --line: #d9dee8; --tint: #eef1f6;
    --accent: #ffe14d; --mark-edge: #e6c200; --chatbg: #d6e0eb;
    --purpose: #3b82f6; --commitment: #ef6c4a; --rules: #8b5cf6; --interdependence: #10a37f;
  }
  body { background: var(--bg); color: var(--ink); }
  .found span { border-color: var(--line); }
  .found span.on { color: #fff; }
  nav.tabs button[aria-selected="true"] { border-bottom-color: var(--ink); }
  nav.tabs button.pulse { animation-name: pulse2; }
  @keyframes pulse2 { 50% { background: #fff6c2; } }
  .file { background: var(--panel); }
  .file .f { background: var(--tint); }
  .sv { box-shadow: 0 0 0 1px var(--line); }
  .speech { color: var(--ink); }
  .speech b { color: var(--ink); background: linear-gradient(transparent 55%, var(--accent) 55%); }
  .controls button, .thumbs button, .btn, .conds button { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .thumbs button[aria-current="true"] { border: 2px solid var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--mark-edge); color: var(--ink); }
  .prompt b { color: var(--ink); background: linear-gradient(transparent 55%, var(--accent) 55%); }
  .hint-on .hot { outline-color: #f59e0b; }
  .case { background: #fff; border: 1px solid var(--line); border-left-width: 4px; }
  .chain div { background: var(--tint); }
  .toast { background: var(--ink); border-color: var(--ink); color: #fff; }
  .overlay { background: var(--bg); }
  .bigstat div { background: #fff; border: 1px solid var(--line); }
  .sitebar { display: none; }
  .sitebar .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; text-decoration: none; color: var(--ink); letter-spacing: -0.01em; }
  .sitebar .dots { display: inline-grid; grid-template-columns: repeat(2, 7px); gap: 3px; }
  .sitebar .dots i { width: 7px; height: 7px; border-radius: 2px; display: block; }
  .sitebar nav { display: flex; gap: 4px; }
  .sitebar nav a { font-size: 14px; text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 8px; }
  .sitebar nav a:hover { background: var(--tint); color: var(--ink); }
  .sitebar nav a[aria-current="page"] { color: var(--ink); font-weight: 700; background: var(--tint); }
  @media (min-width: 1024px) {
    body { flex-direction: column; align-items: center; height: 100vh; height: 100dvh; overflow: hidden; }
    .sitebar { align-self: stretch; height: 56px; flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: #fff; border-bottom: 1px solid var(--line); }
    .app { flex: 1; min-height: 0; height: auto; border-color: var(--line); background: var(--bg); }
    header .home { display: none; }
    #view-log { background: #eaf0f6; }
    .desk-h { color: var(--ink); }
    #view-log.flash { animation-name: flash2; }
    @keyframes flash2 { 50% { background: #fff6c2; } }
  }
  @media (max-width: 520px) { .sub-h { display: none; } .stats { gap: 8px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="sitebar">
  <a class="brand" href="../index.html">
    <span class="dots" aria-hidden="true"><i style="background:var(--purpose)"></i><i style="background:var(--commitment)"></i><i style="background:var(--rules)"></i><i style="background:var(--interdependence)"></i></span>
    모임이 아닌, "팀"
  </a>
  <nav><a href="../game/index.html">조장 시뮬레이터</a><a href="index.html" aria-current="page">팀 디버거</a></nav>
</div>
<div class="app" id="app">
  <header>
    <div class="hrow">
      <h1>🔍 팀 디버거<span class="sub-h"> · 3조 사건</span></h1>
      <a class="home" href="../index.html">처음으로</a>
      <div class="stats"><span>⏱ <b id="time">0:00</b></span><span>헛짚음 <b id="miss">0</b></span><span>증거 <b id="evc">0/10</b></span></div>
    </div>
    <div class="found" id="found"></div>
  </header>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="result" aria-selected="true">📽 발표 PPT</button>
    <button type="button" role="tab" data-tab="log" aria-selected="false">💬 단톡방 기록</button>
    <button type="button" role="tab" data-tab="case" aria-selected="false">📋 사건 파일</button>
  </nav>
  <div class="stage" id="stage">
    <main id="main">
      <section class="view on" id="view-result"></section>
      <section class="view" id="view-log"></section>
      <section class="view" id="view-case"></section>
    </main>
  </div>
  <footer>
    <div class="prompt" id="prompt"></div>
    <div id="actions"></div>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   데이터 (근거: 9주차 Building a Team 6–10쪽)
   시나리오: 「3조의 열흘」 게임에서 네 조건이 모두 무너지는 경로와 같은 대화
   ========================================================= */
const CONDITIONS = {
  purpose:         { name: "공동 목적",   page: 7,  color: "var(--purpose)" },
  commitment:      { name: "헌신",       page: 8,  color: "var(--commitment)" },
  rules:           { name: "운영 규칙",   page: 9,  color: "var(--rules)" },
  interdependence: { name: "상호의존성", page: 10, color: "var(--interdependence)" },
};
const MEMBERS = {
  me: { name: "민준(조장)", color: "#334155" }, jiho: { name: "지호", color: "#2563eb" },
  doyun: { name: "도윤", color: "#0891b2" }, haeun: { name: "하은", color: "#db2777" }, rin: { name: "린", color: "#7c3aed" },
};

// 단톡방 기록. id로 단서를 구분한다.
const LOG = [
  { day: "D-10 · 첫 회의" },
  { id: "p1", from: "jiho",  text: "주제 '일회용 컵 줄이기' 확정! 근데 발표 방향은 어떻게 감?" },
  { id: "p2", from: "jiho",  text: "난 현황 데이터 깔끔하게 보여 주는 정보 전달형이 좋을 듯" },
  { id: "p3", from: "haeun", text: "학생들 목소리가 중요하지 않아? 설문 위주로 가자" },
  { id: "p4", from: "doyun", text: "교수님은 해결책 좋아하시던데. 제안 위주로 ㄱ" },
  { id: "p5", from: "rin",   text: "저는… 아무거나 좋아요 ㅎㅎ" },
  { id: "P",  from: "me",    text: "다 좋은 의견이네! 일단 각자 맡은 파트 조사해 오자. 합치면서 맞추면 돼" },
  { id: "x1", from: "doyun", text: "ㅇㅋ" },
  { id: "x2", from: "haeun", text: "그럼 난 설문 쪽으로 할게~" },
  { id: "x3", from: "jiho",  text: "난 데이터 위주로 ㄱㄱ" },

  { day: "D-8 · 초안 마감" },
  { id: "r1", from: "haeun", text: "오늘 슬라이드 초안 마감 맞지??" },
  { id: "r2", from: "rin",   text: "아 저는 일요일까지인 줄 알았어요" },

  { text: "D-8 규칙 없이 \"내가 합칠게\" → D-2 템플릿 섞임 → 발표 3분 전까지 최신 파일 찾기", conds: ["rules"] },
  { text: "D-10 목적을 정하지 않음 → D-2 \"결론 뭐로 해?\" → D-1 \"정한 적 없지 않나?\" → 질문과 상관없는 결론", conds: ["purpose"] },
];

/* =========================================================
   상태
   ========================================================= */
const state = { started: false, t0: 0, timer: null, miss: 0, solved: {}, found: new Set(), pending: null, pendingEv: null, solveSecs: null, step: "find", slide: 0, playing: null, hint: false };
const $ = (id) => document.getElementById(id);
function el(tag, cls, html) { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2800); }
function fmt(s) { return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function miss() { state.miss++; $("miss").textContent = state.miss; }
function dayOf(id) { let d = ""; for (const l of LOG) { if (l.day) d = l.day.split(" ")[0]; if (l.id === id) return d; } }

function tab(name) {
  if (typeof isDesk === "function" && isDesk()) {
    const v = $("view-" + name); v.classList.remove("flash"); void v.offsetWidth; v.classList.add("flash"); return;
  }
  document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  document.querySelectorAll(".view").forEach((v) => v.classList.toggle("on", v.id === "view-" + name));
  $("main").scrollTop = 0;
}
document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => tab(b.dataset.tab)));

function renderFound() {
  $("found").innerHTML = "";
  ORDER.forEach((k, i) => {
    const s = el("span", state.solved[k] ? "on" : "", state.solved[k] ? `${CONDITIONS[k].name} ${foundOf(k).length}/${evOf(k).length}` : `버그 ${i + 1}`);
    if (state.solved[k]) s.style.background = CONDITIONS[k].color;
    $("found").append(s);
  });
  $("evc").textContent = `${state.found.size}/${EV_TOTAL}`;
}

/* ---------- 발표 PPT ---------- */
function slideHTML(s) {
  if (s.kind === "cover") return `<div class="sv cover" id="sv">${s.html}<span class="who">${s.who}</span></div>`;
  if (s.kind === "qa") return `<div class="sv qa" id="sv"><div class="hd">${s.hd}</div><div class="bd">${s.html}</div></div>`;
  const hd = `<div class="hd${s.hdHot ? " hot" : ""}"${s.hdHot ? ` data-hot="${s.hdHot}"` : ""}>${s.hd}</div>`;
  return `<div class="sv tpl-${s.tpl || "a"}" id="sv"${s.bodyHot ? ` data-hot="${s.bodyHot}"` : ""}>${hd}<div class="bd">${s.html}</div><span class="who">${s.who}</span></div>`;
}
function renderResult() {
  const v = $("view-result"); v.innerHTML = "";
  v.append(el("div", "desk-h", "📽 발표 PPT <span>이상한 곳을 눌러 보세요</span>"));
  const file = el("div", "file hot", "📁 제출 폴더: " + FILES.map((f) => `<span class="f">${f}</span>`).join(""));
  file.dataset.hot = "e-rfile"; v.append(file);
  const s = SLIDES[state.slide];
  const wrap = el("div", "fitbox", slideHTML(s)); wrap.id = "svbox"; v.append(wrap);
  v.append(el("div", "speech", s.kind === "qa" ? "🎤 <b>질의응답</b>" : `🎤 <b>${s.who}</b>: "${s.say}"`));
  const ctr = el("div", "controls");
  ctr.innerHTML = `<button type="button" id="prev">◀</button><button type="button" id="play">${state.playing ? "⏸ 정지" : "▶ 발표 재생"}</button>
    <div class="scene-no">${state.slide + 1} / ${SLIDES.length}</div><button type="button" id="next">▶▶</button>`;
  v.append(ctr);
  const th = el("div", "thumbs");
  SLIDES.forEach((x, i) => { const b = el("button", null, x.kind === "qa" ? "Q&A" : String(i + 1)); b.type = "button"; b.setAttribute("aria-current", String(i === state.slide)); b.onclick = () => go(i); th.append(b); });
  v.append(th);
  v.append(el("p", "tip", "3조가 실제로 한 발표입니다. 이상한 곳을 눌러 보세요. 슬라이드 내용, 모양, 질의응답, 제출 파일 어디에든 문제가 있을 수 있어요."));
  $("prev").onclick = () => go(state.slide - 1);
  $("next").onclick = () => go(state.slide + 1);
  $("play").onclick = togglePlay;
  // 단서 표시
  v.querySelectorAll("[data-hot]").forEach((n) => {
    const k = n.dataset.hot;
    if (n.id !== "sv") n.classList.add("hot");
    if (state.found.has(k)) n.classList.add("solved");
  });
  v.classList.toggle("hint-on", state.hint);
  // 클릭: 가장 안쪽의 data-hot을 쓴다
  $("sv").onclick = (ev) => {
    const n = ev.target.closest("[data-hot]");
    if (!n) { toast("여기는 이상 없어 보인다. 내용, 숫자, 슬라이드 모양을 살펴보자."); return; }
    spot(n.dataset.hot);
  };
  file.onclick = () => spot("e-rfile");
  fitSlide();
}
const SLIDE_BASE = 440;
const isDesk = () => matchMedia("(min-width: 1024px)").matches;
function fitSlide() {
  const box = $("svbox"); const sv = $("sv"); if (!box || !sv) return;
  // 데스크톱에서는 칸 높이 안에 컨트롤까지 보이도록 슬라이드 크기를 제한한다
  const ps = getComputedStyle(box.parentElement);
  let w = box.parentElement.clientWidth - parseFloat(ps.paddingLeft) - parseFloat(ps.paddingRight);
  if (isDesk()) w = Math.min(w, ($("view-result").clientHeight - 210) * 16 / 9);
  w = Math.max(w, 280);
  box.style.width = w + "px";
  const scale = w / SLIDE_BASE;
  sv.style.transform = `scale(${scale})`;
  box.style.height = (SLIDE_BASE * 9 / 16) * scale + "px";
}
new ResizeObserver(fitSlide).observe(document.getElementById("view-result"));

function go(i) { state.slide = (i + SLIDES.length) % SLIDES.length; renderResult(); }
function togglePlay() {
  if (state.playing) { clearInterval(state.playing); state.playing = null; renderResult(); return; }
  state.playing = setInterval(() => {
    if (state.slide === SLIDES.length - 1) { clearInterval(state.playing); state.playing = null; renderResult(); return; }
    go(state.slide + 1);
  }, 3000);
  renderResult();
}

/* ---------- 단톡방 기록 ---------- */
function isRoot(id) { return Object.entries(BUGS).some(([k, b]) => state.solved[k] && b.roots.includes(id)); }
function renderLog() {
  const v = $("view-log"); v.innerHTML = "";
  v.append(el("div", "desk-h", `💬 단톡방 기록 <span>${state.step === "trace" ? "문제가 시작된 메시지를 누르세요" : "버그를 찾으면 여기서 원인을 찾아요"}</span>`));
  const log = el("div", "log");
  for (const line of LOG) {
    if (line.day) { const d = el("div", "day"); d.append(el("span", null, line.day)); log.append(d); continue; }
    if (line.sys) { const s = el("div", "sys" + (isRoot(line.id) ? " root" : ""), line.sys); s.onclick = () => pick(line.id, s); log.append(s); continue; }
    const m = MEMBERS[line.from];
    const row = el("div", "m" + (line.from === "me" ? " mine" : ""));
    const bb = el("div", "bb" + (isRoot(line.id) ? " root" : ""), line.text);
    bb.onclick = () => pick(line.id, bb);
    const col = el("div"); const nm = el("div", "nm", m.name);
    if (line.from === "me") { nm.style.textAlign = "right"; col.append(nm, bb); row.append(col); }
    else { const av = el("div", "av", m.name[0]); av.style.background = m.color; col.append(nm, bb); row.append(av, col); }
    log.append(row);
  }
  v.append(log);
  document.body.classList.toggle("tracing", state.step === "trace");
}

/* ---------- 사건 파일 ---------- */
function renderCase() {
  const v = $("view-case"); v.innerHTML = "";
  v.append(el("div", "desk-h", `📋 사건 파일 <span>${Object.keys(state.solved).length} / 4</span>`));
  const keys = ORDER.filter((k) => state.solved[k]);
  if (!keys.length) { v.append(el("div", "empty-case", "아직 해결한 버그가 없습니다.<br>발표 PPT에서 이상한 곳을 찾아보세요.")); return; }
  for (const k of keys) {
    const b = BUGS[k]; const c = CONDITIONS[k];
    const roots = b.roots.map((id) => LOG.find((l) => l.id === id));
    const card = el("div", "case"); card.style.borderLeftColor = c.color;
    card.innerHTML = `<h3 style="color:${c.color}">${c.name} · 9주차 ${c.page}쪽</h3>
      <div class="chain">
        ${roots.map((r) => `<div>💬 ${dayOf(r.id)} ${MEMBERS[r.from].name}: "${r.text}"</div>`).join('<div class="arr">그리고</div>')}
        <div class="arr">↓ 이 말 때문에 발표에서 (증거 ${foundOf(k).length}/${evOf(k).length})</div>
        ${foundOf(k).map((id) => `<div>📽 ${EVIDENCE[id].label}</div>`).join("")}
        ${foundOf(k).length < evOf(k).length ? `<div class="arr">❔ 아직 못 찾은 증거 ${evOf(k).length - foundOf(k).length}개</div>` : ""}
      </div>
      <p><b>강의에서는</b> ${b.lecture}</p>
      <p><b>이렇게 했다면</b> ${b.tip}</p>`;
    v.append(card);
  }
}

/* ---------- 진행 ---------- */
function setPrompt(html, actions = []) {
  $("prompt").innerHTML = html; const a = $("actions"); a.innerHTML = "";
  if (actions.length) { const r = el("div", "row"); actions.forEach((x) => r.append(x)); a.append(r); }
}
function btn(text, fn, primary) { const b = el("button", "btn" + (primary ? " primary" : ""), text); b.type = "button"; b.onclick = fn; return b; }

function promptFind() {
  state.step = "find"; state.pending = null; state.pendingEv = null; document.body.classList.remove("tracing");
  const left = ORDER.length - Object.keys(state.solved).length;
  const hintBtn = btn(state.hint ? "힌트 끄기" : "💡 힌트: 누를 수 있는 곳 보기", () => { state.hint = !state.hint; renderResult(); promptFind(); });
  if (left === 0) {
    setPrompt(`🔎 버그 4개는 다 풀었어요. <b>남은 증거</b>를 찾아 누르면 사건 파일에 더해져요. (증거 ${state.found.size}/${EV_TOTAL})`, [hintBtn, btn("최종 보고서", finish, true)]);
    return;
  }
  setPrompt(`📽 발표 PPT에서 <b>이상한 곳</b>을 찾아 누르세요. (남은 버그 ${left}개 · 증거 ${state.found.size}/${EV_TOTAL})`, [hintBtn]);
}
function spot(key) {
  if (!state.started) return;
  if (state.step !== "find") { toast("먼저 지금 버그의 원인을 찾아 주세요."); return; }
  if (CLUES[key]) { toast("🔎 " + CLUES[key]); return; }
  if (DECOYS[key]) { toast(DECOYS[key]); miss(); return; }
  const ev = EVIDENCE[key]; if (!ev) return;
  if (state.found.has(key)) { toast("이미 찾은 증거예요. 사건 파일에서 볼 수 있어요."); return; }
  const c = CONDITIONS[ev.cond];
  state.found.add(key);
  if (state.solved[ev.cond]) {
    // 이미 원인을 찾은 조건: 추적 없이 증거만 더한다
    renderFound(); renderResult(); renderCase();
    toast(`✅ ${c.name} 증거 추가 (${foundOf(ev.cond).length}/${evOf(ev.cond).length}): ${ev.label}`);
    if (state.found.size === EV_TOTAL) {
      setPrompt(`🏅 <b>완벽 수사!</b> 증거 ${EV_TOTAL}개를 모두 찾았어요. 한 조건이 무너지면 발표 여러 곳에서 드러난다.`, [btn("사건 파일 보기", () => tab("case")), btn("최종 보고서", finish, true)]);
    } else promptFind();
    return;
  }
  state.pending = ev.cond; state.pendingEv = key; state.step = "trace";
  if (state.playing) togglePlay();
  renderFound(); renderResult();
  setPrompt(`🐞 <b>버그 발견!</b> ${ev.label}<br>💬 이 문제가 <b>시작된 메시지</b>를 단톡방 기록에서 찾아 누르세요.`, [
    btn("발표 다시 보기", () => tab("result")), btn("단톡방 기록 열기", () => tab("log"), true),
  ]);
  renderLog();
  const t = document.querySelector('[data-tab="log"]'); t.classList.remove("pulse"); void t.offsetWidth; t.classList.add("pulse");
}
function pick(id, node) {
  if (state.step !== "trace") { if (state.started && state.step === "find") toast("먼저 발표 PPT에서 버그를 찾아 주세요."); return; }
  const bug = BUGS[state.pending];
  if (bug.roots.includes(id)) { node.classList.add("root"); state.step = "cond"; promptCond(id); return; }
  miss(); node.classList.remove("nope"); void node.offsetWidth; node.classList.add("nope");
  toast(bug.near[id] || "이 메시지는 이 버그와 관계가 적어 보여요.");
}
function promptCond(rootId) {
  const r = LOG.find((l) => l.id === rootId);
  setPrompt(`✅ 찾았다! ${MEMBERS[r.from].name}: "${r.text}"<br>이 말 때문에 무너진 <b>팀의 조건</b>은?`);
  const g = el("div", "conds");
  ORDER.forEach((k) => {
    const c = CONDITIONS[k];
    const b = el("button", null, `${c.name}<small>9주차 ${c.page}쪽</small>`); b.type = "button";
    b.style.borderLeft = `4px solid ${c.color}`; b.onclick = () => answer(k); g.append(b);
  });
  $("actions").append(g);
}
const HINTS = {
  purpose: "발표가 '누구에게 무엇을 하자는 것인지' 처음부터 정해지지 않았다는 점을 생각해 보자.",
  commitment: "하은이 막힌 걸 말하지 못하게 된 분위기를 생각해 보자.",
  rules: "마감·저장 위치·템플릿 같은 '일하는 방식'을 생각해 보자.",
  interdependence: "각자 일은 했는데 서로의 파트를 확인하지 않았다는 점을 생각해 보자.",
};
function answer(k) {
  const key = state.pending;
  if (k !== key) { miss(); toast(HINTS[key]); return; }
  state.solved[key] = true;
  renderFound(); renderResult(); renderLog(); renderCase();
  const c = CONDITIONS[key]; const done = Object.keys(state.solved).length === ORDER.length;
  if (done && state.solveSecs == null) { state.solveSecs = Math.floor((Date.now() - state.t0) / 1000); clearInterval(state.timer); }
  const more = evOf(key).length - foundOf(key).length;
  setPrompt(`🎉 <b style="color:${c.color}">${c.name}</b>이 무너진 버그를 해결했어요.${more ? ` 이 조건의 증거가 발표 어딘가에 ${more}개 더 있어요.` : ""}`, [
    btn("사건 파일 보기", () => tab("case")),
    btn(done ? "최종 보고서" : "다음 버그 찾기", () => { if (done) finish(); else { tab("result"); promptFind(); } }, true),
  ]);
}

/* ---------- 시작 / 끝 ---------- */

function start() {
  $("overlay")?.remove(); state.started = true; state.t0 = Date.now();
  state.timer = setInterval(() => { $("time").textContent = fmt(Math.floor((Date.now() - state.t0) / 1000)); }, 500);
  tab("result"); promptFind();
}
function finish() {
  $("toast").classList.remove("show"); $("overlay")?.remove();
  clearInterval(state.timer); if (state.playing) togglePlay();
  const secs = state.solveSecs ?? Math.floor((Date.now() - state.t0) / 1000);
  const perfect = state.found.size === EV_TOTAL;
  const o = el("div", "overlay"); o.id = "overlay";
  o.innerHTML = `
    <h2>📋 최종 보고서</h2>

    ${perfect ? `<p>🏅 <b>완벽 수사.</b> 증거를 모두 찾았다.</p>` : `<p>아직 못 찾은 증거가 ${EV_TOTAL - state.found.size}개 있다. 한 조건이 무너지면 발표 여러 곳에 흔적이 남는다.</p>`}

    <h3>버그는 따로따로가 아니었다</h3>
    <ul class="links">${CROSS.map((c) => `<li>${c.text}<br><span class="muted">${c.conds.map((k) => CONDITIONS[k].name).join(" → ")}</span></li>`).join("")}</ul>
    <p>모든 모임이 팀은 아니다. 팀은 단순히 지시를 따르는 사람들의 모임이 아니라, 개인의 이익을 넘어 함께 무언가를 이루는 집단이다. <span class="muted">(9주차 6쪽)</span></p>
    <p class="muted">기록: ${fmt(secs)} · 헛짚음 ${state.miss}회 · 증거 ${state.found.size}/${EV_TOTAL}. 다른 조와 비교해 보세요.</p>`;
  $("stage").append(o);
  setPrompt(perfect ? "완벽 수사! 사건 파일에서 버그별 원인과 증거를 다시 볼 수 있어요." : "수사 완료! 남은 증거를 더 찾거나 처음부터 다시 할 수 있어요.", [
    ...(perfect ? [] : [btn("남은 증거 찾기", () => { $("overlay")?.remove(); tab("result"); promptFind(); })]),
    btn("사건 파일 보기", () => { $("overlay")?.remove(); tab("case"); }), btn("처음부터 다시", reset, true),
  ]);
}
function reset() {
  clearInterval(state.timer); if (state.playing) togglePlay();
  Object.assign(state, { started: false, miss: 0, solved: {}, found: new Set(), pending: null, pendingEv: null, solveSecs: null, step: "find", slide: 0, hint: false });
  $("time").textContent = "0:00"; $("miss").textContent = "0"; $("overlay")?.remove();
  renderAll(); intro();
}
document.addEventListener("keydown", (e) => {
  if (!state.started || $("overlay")) return;
  if (e.key === "ArrowRight") go(state.slide + 1);
  if (e.key === "ArrowLeft") go(state.slide - 1);
});
function renderAll() { renderFound(); renderResult(); renderLog(); renderCase(); }
if (location.protocol !== "file:" && !location.hostname.endsWith("github.io")) {
  document.querySelectorAll(".home, .sitebar nav").forEach((a) => (a.style.display = "none"));
  document.querySelector(".sitebar .brand").removeAttribute("href");
}
renderAll();
intro();
</script>
</body>
</html>
