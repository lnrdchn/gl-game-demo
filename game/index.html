<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3조의 열흘: 우리는 팀이 될 수 있을까?</title>
<style>
  :root {
    --bg: #b9cbdc; --panel: #ffffff; --ink: #1f2933; --muted: #6b7785; --mine: #ffe14d; --line: #d7dee6;
    --purpose: #3b82f6; --commitment: #ef6c4a; --rules: #8b5cf6; --interdependence: #10a37f;
    --good: #16a34a; --bad: #dc2626; --mid: #d97706;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; color: var(--ink); background: #e9eef3; display: flex; justify-content: center; }
  .phone { width: 100%; max-width: 440px; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); box-shadow: 0 0 0 1px var(--line); }

  .top { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 14px; }
  .room { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .room h1 { font-size: 16px; margin: 0; }
  .room .sub { font-size: 12px; color: var(--muted); }
  .tools { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .tools button { font: inherit; font-size: 11px; padding: 3px 7px; border: 1px solid var(--line); background: #fff; border-radius: 999px; cursor: pointer; color: var(--muted); }
  .tools button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  .gauges { display: none; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .gauges.show { display: grid; }
  .gauge .label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .gauge .label b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .gauge.focus .label span { color: var(--ink); font-weight: 700; }
  .bar { height: 7px; background: #edf1f5; border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; transition: width .6s ease; }
  .delta { margin-left: 4px; font-size: 11px; font-weight: 700; font-style: normal; opacity: 0; transition: opacity .3s; }
  .delta.show { opacity: 1; } .delta.up { color: var(--good); } .delta.down { color: var(--bad); }

  .chat { flex: 1; overflow-y: auto; padding: 14px 12px 8px; }
  .day { text-align: center; margin: 14px 0 10px; }
  .day span { display: inline-block; font-size: 12px; background: rgba(0,0,0,.18); color: #fff; padding: 4px 12px; border-radius: 999px; }
  .day .tag { display: inline-block; margin-left: 6px; font-size: 11px; color: #fff; padding: 2px 8px; border-radius: 999px; }
  .sys { text-align: center; font-size: 12px; color: #4b5866; margin: 8px 16px; line-height: 1.5; animation: pop .25s ease; }
  .msg { display: flex; gap: 8px; margin: 6px 0; align-items: flex-start; animation: pop .25s ease; }
  .avatar { flex: 0 0 34px; height: 34px; border-radius: 12px; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .msg .body { max-width: 78%; }
  .msg .name { font-size: 12px; color: #3d4a57; margin: 0 0 3px 2px; }
  .msg .name .dm { font-size: 10px; background: #334155; color: #fff; border-radius: 4px; padding: 1px 4px; margin-left: 4px; }
  .bubble { background: #fff; padding: 8px 11px; border-radius: 4px 14px 14px 14px; font-size: 14px; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
  .msg.mine { justify-content: flex-end; align-items: flex-end; }
  .msg.mine .bubble { background: var(--mine); border-radius: 14px 4px 14px 14px; }
  .unread { font-size: 11px; font-weight: 700; color: #d4a300; align-self: flex-end; margin-bottom: 2px; }
  .typing .bubble { color: var(--muted); letter-spacing: 2px; }
  .back { margin: 8px 6px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.65); font-size: 12px; line-height: 1.5; border-left: 4px solid var(--muted); animation: pop .25s ease; }
  .back b { font-weight: 700; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .choices { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 12px 14px; min-height: 64px; max-height: 46vh; overflow-y: auto; }
  .choices .hint { font-size: 12px; color: var(--muted); margin: 0 0 8px 2px; }
  .choice { display: block; width: 100%; text-align: left; font: inherit; font-size: 14px; line-height: 1.4; background: #f6f8fa; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 6px; cursor: pointer; color: var(--ink); }
  .choice:hover, .choice:focus-visible { background: #fff7c2; border-color: #e6c800; outline: none; }
  .primary { display: block; width: 100%; font: inherit; font-size: 15px; font-weight: 700; padding: 12px; border: 0; border-radius: 12px; background: var(--ink); color: #fff; cursor: pointer; }

  .card { background: #fff; border-radius: 16px; padding: 18px 16px; margin: 10px 2px; line-height: 1.55; font-size: 14px; animation: pop .3s ease; }
  .card h2 { font-size: 18px; margin: 0 0 8px; }
  .card h3 { font-size: 14px; margin: 18px 0 6px; }
  .card p { margin: 6px 0; }
  .card ol, .card ul { margin: 6px 0; padding-left: 18px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; color: #fff; padding: 3px 9px; border-radius: 999px; margin-bottom: 8px; }
  .muted { color: var(--muted); font-size: 12px; }
  .final-bars { display: grid; gap: 6px; margin: 8px 0; }
  .final-bars .row { display: grid; grid-template-columns: 74px 1fr 30px; align-items: center; gap: 8px; font-size: 12px; }
  .final-bars .row b { text-align: right; font-variant-numeric: tabular-nums; }
  .plan { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; margin: 8px 0; }
  .plan .d { font-weight: 700; }

  /* 발표 슬라이드 플레이어 */
  .deck { background: #111827; border-radius: 12px; padding: 10px; margin: 8px 0; color: #e5e7eb; }
  .filebar { font-family: ui-monospace, Menlo, monospace; font-size: 11px; margin-bottom: 8px; color: #cbd5e1; }
  .filebar.bad { color: #fca5a5; }
  .sv { position: relative; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: #fff; color: #111827; }
  .sv .hd { height: 16%; display: flex; align-items: center; padding: 0 10px; font-size: 13px; font-weight: 800; color: #fff; background: #1d4ed8; }
  .sv .bd { padding: 8px 12px; font-size: 12px; line-height: 1.45; }
  .sv .who { position: absolute; right: 8px; bottom: 5px; font-size: 9px; color: #6b7280; }
  .sv.tpl-b { background: #14532d; color: #f0fdf4; font-family: "Times New Roman", Georgia, serif; }
  .sv.tpl-b .hd { background: transparent; color: #fef08a; font-style: italic; font-weight: 400; font-size: 15px; border-bottom: 1px solid #86efac; }
  .sv.tpl-b .who { color: #bbf7d0; }
  .sv.cover { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: linear-gradient(135deg,#1e3a8a,#2563eb); color: #fff; padding: 10px; }
  .sv.cover .t { font-size: 17px; font-weight: 800; line-height: 1.3; }
  .sv.cover .g { margin-top: 8px; font-size: 11px; background: rgba(255,255,255,.18); padding: 4px 8px; border-radius: 6px; }
  .sv.cover .who { color: #c7d2fe; }
  .sv.qa { background: #0b1220; color: #e5e7eb; }
  .sv.qa .hd { background: #334155; }
  .sv.qa .bd { font-size: 11.5px; }
  .sv.qa .q { margin: 3px 0; }
  .sv .big { font-size: 26px; font-weight: 800; color: #1d4ed8; margin: 6px 0 2px; }
  .sv .src { font-size: 9px; color: #6b7280; margin: 2px 0; }
  .sv.tpl-b .src { color: #bbf7d0; }
  .sv ul { margin: 2px 0; padding-left: 16px; }
  .sv .calc { font-size: 14px; margin: 10px 0 4px; }
  .sv .calc b { font-size: 18px; color: #047857; }
  .sv .ph { margin-top: 6px; height: 44%; border: 2px dashed #9ca3af; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #6b7280; font-size: 12px; }
  .sv .bars2 { display: grid; gap: 4px; margin-top: 4px; }
  .sv .bars2 div { display: grid; grid-template-columns: 96px 1fr 28px; gap: 6px; align-items: center; font-size: 10.5px; }
  .sv .bars2 i { display: block; height: 9px; background: #f97316; border-radius: 3px; }
  .sv .stamp { position: absolute; left: 50%; top: 58%; transform: translate(-50%,-50%) rotate(-8deg); border: 2px solid #9ca3af; color: #9ca3af; padding: 2px 8px; font-size: 11px; font-weight: 700; border-radius: 4px; }
  #slideView { border-radius: 8px; outline: 3px solid transparent; outline-offset: 2px; transition: outline-color .2s; }
  #slideView.buggy { outline-color: #ef4444; }
  .bugs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; min-height: 20px; }
  .ribbon { font-size: 11px; font-weight: 700; color: #fff; padding: 3px 7px; border-radius: 4px; }
  .ribbon.ok { background: var(--good); }
  .speech { margin-top: 8px; font-size: 12.5px; line-height: 1.5; min-height: 38px; color: #f3f4f6; }
  .speech b { color: #fde68a; }
  .dctl { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .dctl button { font: inherit; font-size: 12px; background: #1f2937; color: #e5e7eb; border: 1px solid #374151; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
  .dctl .n { flex: 1; text-align: center; font-size: 11px; color: #9ca3af; }
  .dthumbs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 6px; }
  .dthumbs button { position: relative; font: inherit; font-size: 10px; padding: 6px 0; border-radius: 4px; border: 2px solid transparent; background: #1f2937; color: #cbd5e1; cursor: pointer; }
  .dthumbs button[aria-current="true"] { border-color: #facc15; }
  .dthumbs button.has-bug::after { content: ""; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: #ef4444; }

  .fails { list-style: none; padding: 0 !important; }
  .fails li { background: #f6f8fa; border-radius: 10px; padding: 8px 10px; margin: 6px 0; font-size: 13px; border-left: 4px solid var(--muted); }
  .fails li.bad { border-left-color: var(--bad); }
  .fails li.mid { border-left-color: var(--mid); }
  .fails li.good { border-left-color: var(--good); }
  .fails .cause { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
  .links { list-style: none; padding: 0 !important; }
  .links li { background: #f6f8fa; border-radius: 10px; padding: 8px 10px; margin: 6px 0; font-size: 13px; }
  .links .good { border-left: 4px solid var(--good); }
  .links .bad { border-left: 4px solid var(--bad); }

  /* ===== 데스크톱 데모 (GitHub Pages) ===== */
  .layout { width: 100%; display: flex; justify-content: center; }
  .side { display: none; }
  .tools .home { font-size: 11px; padding: 3px 7px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); text-decoration: none; }
  #slideView { position: relative; }
  #slideView .sv { width: 360px; transform-origin: 0 0; }
  .bigview { display: none; }
  .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, .78); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 24px; }
  .modal[hidden] { display: none; }
  .mbox { width: min(980px, 100%); max-height: 100%; overflow-y: auto; }
  .mbar { display: flex; justify-content: space-between; align-items: center; color: #e5e7eb; margin-bottom: 10px; font-size: 15px; }
  .mbar button { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 8px; border: 1px solid #475569; background: #1f2937; color: #fff; cursor: pointer; }
  .modal .deck { padding: 16px; }
  .modal .speech { font-size: 17px; min-height: 52px; }
  .modal .ribbon { font-size: 14px; padding: 5px 10px; }
  .modal .filebar { font-size: 13px; }
  .modal .dctl button { font-size: 14px; padding: 7px 14px; }
  .modal .dthumbs button { font-size: 13px; padding: 10px 0; }

  @media (min-width: 1080px) {
    body { background: #e7ebf5; }
    .layout { display: grid; grid-template-columns: 250px 440px 300px; gap: 28px; justify-content: center; height: 100vh; height: 100dvh; padding: 22px 24px; }
    .phone { height: 100%; border-radius: 30px; overflow: hidden; box-shadow: 0 0 0 9px #1b2a4a, 0 34px 60px -24px rgba(27, 42, 74, .55); }
    .gauges, #gaugeToggle, .tools .home { display: none !important; }
    .side { display: block; overflow-y: auto; padding: 4px 2px 24px; color: #1b2a4a; }
    .bigview { display: block; width: 100%; font: inherit; font-size: 14px; font-weight: 700; padding: 10px; margin: 8px 0 0; border-radius: 10px; border: 1.5px solid #1b2a4a; background: #fff; cursor: pointer; }
  }
  .side .home { display: inline-block; font-size: 13px; color: #55627d; text-decoration: none; margin-bottom: 18px; }
  .side .home:hover { color: #1b2a4a; }
  .side h2 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .side .about { font-size: 13px; color: #55627d; margin: 0 0 20px; line-height: 1.5; word-break: keep-all; }
  .side h3 { font-size: 14px; margin: 0 0 10px; }

  .tl { list-style: none; margin: 0; padding: 0; position: relative; }
  .tl::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: #cfd6e6; }
  .tl li { position: relative; padding: 0 0 16px 26px; }
  .tl .dot { position: absolute; left: 0; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #e7ebf5; border: 2px solid #cfd6e6; }
  .tl li.done .dot { border-color: transparent; }
  .tl li.now .dot { box-shadow: 0 0 0 4px rgba(255, 225, 77, .9); border-color: transparent; }
  .tl .d { font-size: 13px; font-weight: 800; }
  .tl .lab { font-size: 13px; color: #55627d; }
  .tl .ct { font-size: 12px; font-weight: 700; }
  .tl li.todo { opacity: .55; }
  .tl .said { margin-top: 5px; font-size: 12.5px; line-height: 1.45; background: #fff; border: 1px solid #cfd6e6; border-radius: 4px 10px 10px 10px; padding: 6px 8px; word-break: keep-all; }
  .tl .chips { margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; }
  .tl .chip { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 999px; color: #fff; }

  .pc { background: #fff; border: 1px solid #cfd6e6; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; transition: box-shadow .25s, transform .25s; }
  .pc.focus { box-shadow: 0 0 0 3px var(--c); }
  .pc .top2 { display: flex; justify-content: space-between; align-items: baseline; }
  .pc .nm { font-size: 15px; font-weight: 800; }
  .pc .pg { font-size: 12px; color: #55627d; margin-left: 6px; font-weight: 400; }
  .pc .val { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .pc .today { display: inline-block; font-size: 11px; font-weight: 700; color: #1b2a4a; background: #ffe14d; border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: 2px; }
  .pc .pbar { position: relative; height: 10px; background: #edf1f5; border-radius: 99px; overflow: hidden; margin: 6px 0 8px; }
  .pc .pfill { height: 100%; border-radius: 99px; background: var(--c); transition: width .6s ease; }
  .pc .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: #1b2a4a; opacity: .35; }
  .pc p { margin: 0; font-size: 12.5px; color: #55627d; line-height: 1.45; word-break: keep-all; }
  .pc .pd { font-size: 14px; font-weight: 800; margin-left: 6px; opacity: 0; transition: opacity .3s; }
  .pc .pd.show { opacity: 1; }
  .pc.bump { animation: bump .5s ease; }
  @keyframes bump { 40% { transform: scale(1.03); } }
  .legend2 { font-size: 12px; color: #55627d; line-height: 1.5; margin-top: 4px; }
  @media (prefers-reduced-motion: reduce) { .pc.bump { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
<div class="layout">
<aside class="side" aria-label="열흘 타임라인">
  <a class="home" href="../index.html">처음으로</a>
  <h2>3조의 열흘</h2>
  <p class="about">교양 수업 조별 발표 "일회용 컵, 우리 캠퍼스에서 줄일 수 있을까?"를 5명이 준비한다. 당신은 조장 민준.</p>
  <h3>열흘의 흐름</h3>
  <ol class="tl" id="timeline"></ol>
</aside>
<div class="phone">
  <header class="top">
    <div class="room">
      <div>
        <h1>3조 발표팀 (5)</h1>
        <div class="sub" id="dayLabel">발표까지 D-10</div>
      </div>
      <div class="tools">
        <a class="home" href="../index.html">처음으로</a>
        <button type="button" id="gaugeToggle" aria-pressed="true" title="네 조건 게이지 보이기/숨기기">조건 보기</button>
        <button type="button" data-speed="1.6">느리게</button>
        <button type="button" data-speed="1" aria-pressed="true">보통</button>
        <button type="button" data-speed="0.35">빠르게</button>
      </div>
    </div>
    <div class="gauges show" id="gauges"></div>
  </header>
  <main class="chat" id="chat" aria-live="polite"></main>
  <footer class="choices" id="choices"></footer>
</div>
<aside class="side" aria-label="팀의 네 조건">
  <h3 style="margin-top:42px">팀의 네 조건</h3>
  <div id="panel"></div>
  <p class="legend2">세로선(55) 아래로 내려가면 그 조건이 맡은 슬라이드가 망가진다. 넷 다 60 이상이면 팀 엔딩.</p>
</aside>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-label="3조의 발표 큰 화면">
  <div class="mbox"><div class="mbar"><span>3조의 발표</span><button type="button" id="modalClose">닫기</button></div><div id="mslot"></div></div>
</div>

<script>
/* =========================================================
   1. 기본 데이터  (근거: 9주차 Building a Team 6–10쪽)
   시나리오: 교양 수업 5인 조별 발표
   "일회용 컵, 우리 캠퍼스에서 줄일 수 있을까?" (15분, 슬라이드 6장)
   날마다 조건 하나가 시험대에 오르고, D-2·D-1에 그 선택이 돌아온다.
   ========================================================= */
const CONDITIONS = {
  purpose:         { name: "공동 목적",   short: "목적", page: 7,  color: "var(--purpose)" },
  commitment:      { name: "헌신",       short: "헌신", page: 8,  color: "var(--commitment)" },
  rules:           { name: "운영 규칙",   short: "규칙", page: 9,  color: "var(--rules)" },
  interdependence: { name: "상호의존성", short: "연결", page: 10, color: "var(--interdependence)" },
};
const START = 50;
const TEAM_LINE = 60;     // 네 조건이 모두 이 이상이면 '팀' 엔딩
const WEAK_LINE = 55;     // 이 미만인 조건은 발표 슬라이드에서 망가진 모습으로 보임
const FATIGUE_LIMIT = 2;  // 민준이 혼자 떠안은 일이 이 이상이면 D-1에 몸살

const MEMBERS = {
  me:    { name: "민준(나)", color: "#334155" },  // 조장 · 1, 6번 슬라이드
  jiho:  { name: "지호",     color: "#2563eb" },  // 2번 현황
  doyun: { name: "도윤",     color: "#0891b2" },  // 3번 다른 대학 사례
  haeun: { name: "하은",     color: "#db2777" },  // 4번 설문
  rin:   { name: "린",       color: "#7c3aed" },  // 5번 제안 효과 (교환학생)
};

/* =========================================================
   2. 사건
   - focus: 그날 시험대에 오르는 조건 (null이면 '돌아오는 날')
   - intro(s), choices(s)는 지금까지의 상태 s를 보고 바뀐다.
   - run(s)는 게이지(fx), 플래그(flag), 피로(tire)를 바꾸고 반응 대사를 돌려준다.
   - 대사 형식: { from, text, dm?: true } | { sys } | { back, cond }  (back = 이전 선택이 돌아온 장면)
   ========================================================= */
const EVENTS = [
  {

const KEYS = Object.keys(CONDITIONS);
const state = { scores: {}, flags: {}, tired: [], i: 0, history: [], speed: 1, busy: false, started: false, finished: false };

function fx(s, effects) {
  for (const [k, d] of Object.entries(effects)) s.scores[k] = Math.max(0, Math.min(100, s.scores[k] + d));
}
function flag(s, name) { s.flags[name] = true; }
function tire(s, what) { s.tired.push(what); }
function variantOf(s) { return EVENTS[EVENTS.length - 1].variant(s); }
function focusOf(ev, s) { return ev.id === "final" ? (variantOf(s) === "sick" ? "rules" : "purpose") : ev.focus; }

const $chat = document.getElementById("chat");
const $choices = document.getElementById("choices");
const $gauges = document.getElementById("gauges");

const wait = (ms) => new Promise((r) => setTimeout(r, ms * state.speed));
const down = () => { $chat.scrollTop = $chat.scrollHeight; };
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
const clean = (t) => t.replace(/^\(.*?\)\s*/, "");
const short = (t, n = 34) => { t = clean(t); return t.length > n ? t.slice(0, n) + "…" : t; };

// 헌신이 낮을수록 내 메시지를 늦게 읽는 사람이 많아진다
function unreadCount() { return Math.max(0, Math.min(4, Math.round((70 - state.scores.commitment) / 12))); }

function renderPanel(focus) {
  const box = document.getElementById("panel"); if (!box) return;

    const c = CONDITIONS[k];
    return `<div class="pc${k === focus ? " focus" : ""}" id="pc-${k}" style="--c:${c.color}">

      <p>${PANEL_TEXT[k]}</p></div>`;
  }).join("");
}
function updatePanel(effects) {
  for (const k of KEYS) {
    const v = document.getElementById(`pv-${k}`); if (!v) return;
    v.textContent = state.scores[k];

  }

    const pd = document.getElementById(`pd-${k}`); const pc = document.getElementById(`pc-${k}`);
    pd.textContent = (d > 0 ? "+" : "") + d; pd.style.color = d > 0 ? "var(--good)" : "var(--bad)"; pd.classList.add("show");
    pc.classList.remove("bump"); void pc.offsetWidth; pc.classList.add("bump");
    setTimeout(() => pd.classList.remove("show"), 1800);

function renderTimeline() {
  const ol = document.getElementById("timeline"); if (!ol) return;
  const now = state.finished ? TL.length - 1 : (state.started ? state.history.length : -1);
  ol.innerHTML = TL.map((t, i) => {
    let ck = t.cond;
    if (ck === "final") ck = state.started && state.history.length >= 5 ? focusOf(EVENTS[5], state) : null;
    if (ck === "end") ck = null;
    const color = ck ? CONDITIONS[ck].color : "#475569";
    const h = state.history[i];
    const cls = h || (state.finished && i === TL.length - 1) ? "done" : i === now ? "now" : "todo";
    const tag = ck ? `<span class="ct" style="color:${color}">${CONDITIONS[ck].name}</span>` : t.cond === null ? `<span class="ct" style="color:#475569">선택이 돌아온다</span>` : "";
    const chips = h ? Object.entries(h.diff).filter(([, d]) => d !== 0)
      .map(([k, d]) => `<span class="chip" style="background:${CONDITIONS[k].color}">${CONDITIONS[k].short} ${d > 0 ? "+" : ""}${d}</span>`).join("") : "";
    return `<li class="${cls}"><span class="dot" style="${cls !== "todo" ? `background:${color}` : ""}"></span>
      <div class="d">${t.day} <span class="lab">${t.lab}</span></div>${tag}
      ${h ? `<div class="said">${short(h.text, 46)}</div><div class="chips">${chips}</div>` : ""}</li>`;
  }).join("");
  const cur = ol.querySelector("li.now"); if (cur) cur.scrollIntoView({ block: "nearest" });
}

/* =========================================================
   5. 채팅 화면

function renderGauges(focus) {
  $gauges.innerHTML = "";
  for (const k of KEYS) {
    const c = CONDITIONS[k];
    const g = el("div", "gauge" + (k === focus ? " focus" : ""));
    const label = el("div", "label");
    const name = el("span", null, c.short);
    const delta = el("em", "delta"); delta.id = `delta-${k}`; name.append(delta);
    const val = el("b", null, String(state.scores[k])); val.id = `val-${k}`;
    label.append(name, val);
    const bar = el("div", "bar"); const fill = el("div", "fill");
    fill.id = `fill-${k}`; fill.style.background = c.color; fill.style.width = state.scores[k] + "%";
    bar.append(fill); g.append(label, bar); $gauges.append(g);
  }
  renderPanel(focus);
}
function updateGauges(effects) {
  for (const k of KEYS) {
    document.getElementById(`fill-${k}`).style.width = state.scores[k] + "%";
    document.getElementById(`val-${k}`).textContent = state.scores[k];
  }
  for (const [k, d] of Object.entries(effects || {})) {
    const e = document.getElementById(`delta-${k}`);
    e.textContent = (d > 0 ? "+" : "") + d; e.className = "delta show " + (d > 0 ? "up" : "down");
    setTimeout(() => { e.className = "delta"; }, 1500);
  }
  updatePanel(effects);
}
function addDay(day, title, focus) {
  const d = el("div", "day"); d.append(el("span", null, `${day} · ${title}`));
  if (focus) { const t = el("span", "tag", `${CONDITIONS[focus].name} 시험`); t.style.background = CONDITIONS[focus].color; d.append(t); }
  else if (focus === null) { const t = el("span", "tag", "선택이 돌아온다"); t.style.background = "#475569"; d.append(t); }
  $chat.append(d); $day.textContent = day === "D-day" ? "발표 당일" : `발표까지 ${day}`; down();
}
function addSys(text) { $chat.append(el("div", "sys", text)); down(); }
function addMsg(line) {
  const m = MEMBERS[line.from];
  const row = el("div", "msg" + (line.from === "me" ? " mine" : ""));
  if (line.from === "me") {
    const n = unreadCount();
    if (n > 0) row.append(el("span", "unread", String(n)));
    const body = el("div", "body"); body.append(el("div", "bubble", line.text)); row.append(body);
  } else {
    const av = el("div", "avatar", m.name[0]); av.style.background = m.color;
    const body = el("div", "body");
    const name = el("div", "name", m.name);
    if (line.dm) name.append(el("span", "dm", "개인톡"));
    body.append(name, el("div", "bubble", line.text)); row.append(av, body);
  }
  $chat.append(row); down();
}
// D-2: 이전 선택이 돌아온 장면은 그날 고른 말과 함께 보여 준다
function addBack(line) {
  const h = state.history.find((x) => x.ev.day === line.back);
  const c = CONDITIONS[line.cond];
  const box = el("div", "back"); box.style.borderLeftColor = c.color;
  box.innerHTML = `<b style="color:${c.color}">↩ ${line.back} ${c.name}</b> · 그때 내가 한 말: "${short(h.text, 40)}"`;
  $chat.append(box); down();
}
async function say(line) {
  if (line.back) { await wait(300); addBack(line); await wait(400); if (line.sys) { addSys(line.sys); await wait(500); return; } }
  if (line.sys) { await wait(300); addSys(line.sys); await wait(500); return; }
  if (line.from === "me") { addMsg(line); await wait(450); return; }
  const m = MEMBERS[line.from];
  const row = el("div", "msg typing");
  const av = el("div", "avatar", m.name[0]); av.style.background = m.color;
  const body = el("div", "body"); body.append(el("div", "name", m.name), el("div", "bubble", "•••"));
  row.append(av, body); $chat.append(row); down();
  await wait(Math.min(450 + line.text.length * 20, 1500));
  row.remove(); addMsg(line); await wait(330);
}
function setChoices(nodes) { $choices.innerHTML = ""; nodes.forEach((n) => $choices.append(n)); }

function showStart() {
  stopDeck(); closeModal();
  KEYS.forEach((k) => (state.scores[k] = START));
  state.history = []; state.started = false; state.finished = false;
  renderGauges(); renderTimeline(); $day.textContent = "발표까지 D-10";
  $chat.innerHTML = "";
  const card = el("div", "card");
  const plan = [["D-10", "purpose"], ["D-8", "rules"], ["D-6", "commitment"], ["D-4", "interdependence"]]
    .map(([d, k]) => `<span class="d">${d}</span><span style="color:${CONDITIONS[k].color}"><b>${CONDITIONS[k].name}</b> 시험 · 9주차 ${CONDITIONS[k].page}쪽</span>`).join("");
  card.innerHTML = `
    <h2>3조의 열흘</h2>
    <p>당신은 3조 조장 <b>민준</b>입니다. 5명이 열흘 안에 15분짜리 발표 PPT를 만들어야 합니다. 주제는 <b>"일회용 컵, 우리 캠퍼스에서 줄일 수 있을까?"</b></p>
    <p>날마다 팀의 조건 하나가 시험대에 오릅니다.</p>
    <div class="plan">${plan}<span class="d">D-2·D-1</span><span>그때 고른 말이 <b>돌아옵니다</b></span></div>
    <p>마지막엔 3조가 실제로 한 <b>발표를 재생</b>하고, 어느 슬라이드가 왜 무너졌는지 보여 줍니다.</p>
    <p class="muted">모든 선택지는 실제 조장이 할 법한 말이에요. 3조와 조원은 가상의 인물입니다.</p>`;
  $chat.append(card);
  const btn = el("button", "primary", "시작하기"); btn.type = "button"; btn.onclick = startGame;
  setChoices([btn]);
}
function startGame() {
  KEYS.forEach((k) => (state.scores[k] = START));
  state.flags = {}; state.tired = []; state.i = 0; state.history = []; state.started = true; state.finished = false;
  $chat.innerHTML = ""; renderGauges(); play();
}
async function play() {
  const ev = EVENTS[state.i];
  setChoices([]);
  const focus = focusOf(ev, state);
  renderGauges(focus);
  const title = ev.id === "final" ? (variantOf(state) === "sick" ? "조장이 쓰러졌다" : "결론 다툼") : ev.title;
  addDay(ev.day, title, focus);
  renderTimeline();
  await wait(350);
  for (const line of ev.intro(state)) await say(line);
  const opts = ev.choices(state);
  const btns = opts.map((o) => { const b = el("button", "choice", o.text); b.type = "button"; b.onclick = () => choose(o, ev); return b; });
  setChoices([el("p", "hint", "어떻게 답할까?"), ...btns]);
}
async function choose(opt, ev) {
  if (state.busy) return; state.busy = true; setChoices([]);
  const before = { ...state.scores };
  await say({ from: "me", text: clean(opt.text) });
  const replies = opt.run(state);
  const diff = Object.fromEntries(KEYS.map((k) => [k, state.scores[k] - before[k]]));
  updateGauges(Object.fromEntries(Object.entries(diff).filter(([, d]) => d !== 0)));
  state.history.push({ ev, text: opt.text, diff });
  renderTimeline();
  for (const r of replies) await say(r);
  const last = state.i === EVENTS.length - 1;
  const next = el("button", "primary", last ? "발표하러 가기" : "다음 날로"); next.type = "button";
  next.onclick = () => { if (last) showResult(); else { state.i++; play(); } };
  setChoices([next]); state.busy = false;
}

    html: `<div class="big">하루 3,000개</div><p class="src">캠퍼스 전체 카페 합계 (가상 데이터)</p>`,
    say: "캠퍼스 전체로 세면 하루 3,000개가 버려집니다.", bugs: [] });
  S.push({ who: "도윤", hd: "다른 대학은 어떻게 했나", tpl: R ? "b" : "a",
    html: `<ul><li>A대: 텀블러 지참 시 할인</li><li>B대: 컵 보증금제</li><li>C대: 세척대 설치</li></ul><p class="src">가상 사례</p>`,
    say: "다른 대학들은 이렇게 하고 있습니다.",
    bugs: R ? [["rules", "혼자 다른 템플릿·글씨체"]] : [] });
  S.push({ who: "하은", hd: "설문: 왜 텀블러를 안 쓸까?",
    html: C
      ? `<p>응답 6명</p><div class="ph">그래프 준비 중…</div>`
      : `<p>응답 48명 (가상 데이터)</p><div class="bars2">
          <div><span>씻을 곳이 없어서</span><i style="width:100%"></i><span>41%</span></div>
          <div><span>들고 다니기 귀찮아서</span><i style="width:80%"></i><span>33%</span></div>
          <div><span>할인이 없어서</span><i style="width:63%"></i><span>26%</span></div></div>`,
    say: C ? "응답이… 6명이라서요. 그래프는 아직…" : "응답자 41%가 씻을 곳이 없어서라고 답했습니다.",
    bugs: C ? [["commitment", "응답 6명, 그래프 없음"]] : [] });
  S.push({ who: "린", hd: "제안하면 얼마나 줄까?",
    html: (old ? `<div class="calc">하루 800개 × 30% = <b>240개</b> 절감</div>` : `<div class="calc">하루 3,000개 × 30% = <b>900개</b> 절감</div>`) +
      `<p class="src">할인 제도 참여율 30% 가정 (가상)</p>` + (R ? `<span class="stamp">수정 전 그래프 v1</span>` : ""),
    say: old ? "하루 800개 중 30%, 240개를 줄일 수 있습니다." : fixed ? "900개를… 줄일 수 있습니다. (민준이 고쳐 준 숫자를 그대로 읽는다)" : "하루 3,000개 중 30%, 900개를 줄일 수 있습니다.",
    bugs: [...(old ? [["interdependence", "앞의 2번은 3,000개인데 여기는 800개"]] : fixed ? [["interdependence", "숫자는 조장이 맞췄지만 린은 계산을 모름"]] : []), ...(R ? [["rules", "수정 전 파일이 들어감"]] : [])] });
  const voted = state.flags.voted;
  S.push(P
    ? (voted
        ? { who: "민준", hd: "결론: 다른 대학 사례 정리", html: `<p>A대 할인 · B대 보증금 · C대 세척대</p><p>여러 방법이 있습니다.</p>`,
            say: "이렇게 여러 방법이 있다는 걸 알 수 있었습니다.", bugs: [["purpose", "결론이 1번의 질문에 답하지 않음"]] }
        : { who: "민준", hd: "결론: 텀블러 굿즈 디자인 공모전을 열자!", html: `<p>재밌고 참여도 높을 것 같습니다 🎨</p>`,
            say: "그래서 저희는 굿즈 공모전을 제안합니다!", bugs: [["purpose", "결론이 1번의 질문에 답하지 않음"]] })
    : { who: "민준", hd: "제안: 텀블러 지참 시 300원 할인",
        html: (voted ? `<p>A대 할인 · B대 보증금 · C대 세척대 중 →</p>` : "") + `<p>학생회에 한 학기 시범 운영을 제안합니다.</p><p>→ 하루 약 ${old ? "240" : "900"}개 절감 기대</p>`,
        say: "학생회에 한 학기 시범 운영을 제안합니다.", bugs: [] });
  const qa = [];
  if (R) qa.push({ sys: "(발표 시작 전, 3분 동안 최신 파일을 찾았다)" });
  if (P) qa.push({ q: "교수님: 그래서 이 발표, 누구한테 뭘 하자는 거예요?", a: "민준: 아… 그게…", cond: "purpose" });
  if (C) qa.push({ q: "교수님: 설문 6명으로 결론 내기는 어렵지 않나요?", a: "하은: …네", cond: "commitment" });
  if (old) qa.push({ q: "교수님: 2번이랑 5번 숫자가 다른데 어느 게 맞아요?", a: "지호·린이 서로를 쳐다봤다.", cond: "interdependence" });
  if (fixed) qa.push({ q: "교수님: 5번의 900개는 어떻게 계산한 거예요?", a: "린: 그건… 민준이 고쳐 줘서…", cond: "interdependence" });
  if (!P && !C && !I) qa.push({ q: "교수님: 학생회에 바로 가져가도 되겠네요. 세척대 얘기도 같이 해 보세요.", a: "민준: 네, 4번 설문 결과로 같이 말하겠습니다!" });
  S.push({ who: "질의응답", kind: "qa", hd: "질의응답", qa,
    say: qa.filter((x) => x.q).map((x) => x.q).join(" "),
    bugs: qa.filter((x) => x.cond).map((x) => [x.cond, x.q.replace("교수님: ", "")]) });
  return S;
}

const deck = { slides: [], i: 0, timer: null };
function stopDeck() { if (deck.timer) { clearInterval(deck.timer); deck.timer = null; } }
function slideHTML(s) {
  const ribbons = "";
  if (s.kind === "cover") return `<div class="sv cover">${s.html}${ribbons}<span class="who">${s.who}</span></div>`;
  if (s.kind === "qa") return `<div class="sv qa"><div class="hd">${s.hd}</div><div class="bd">${s.qa.map((x) =>
      x.sys ? `<div class="q" style="color:#fca5a5">${x.sys}</div>` : `<div class="q">❓ ${x.q}<br><span style="color:#9ca3af">↳ ${x.a}</span></div>`).join("")}</div></div>`;
  return `<div class="sv tpl-${s.tpl || "a"}"><div class="hd">${s.hd}</div><div class="bd">${s.html}</div>${ribbons}<span class="who">${s.who}</span></div>`;
}
function showSlide(i) {
  deck.i = (i + deck.slides.length) % deck.slides.length;
  const s = deck.slides[deck.i];
  document.getElementById("slideView").innerHTML = slideHTML(s);
  document.getElementById("slideView").classList.toggle("buggy", s.bugs.length > 0);
  fitSlide();
  document.getElementById("bugs").innerHTML = s.bugs.length
    ? s.bugs.map(([k, t]) => `<span class="ribbon" style="background:${CONDITIONS[k].color}">❌ ${CONDITIONS[k].name} · ${t}</span>`).join("")
    : (s.kind === "qa" ? "" : `<span class="ribbon ok">✅ 이 슬라이드는 이상 없음</span>`);
  document.getElementById("speech").innerHTML = s.kind === "qa"
    ? "🎤 <b>질의응답</b>" : `🎤 <b>${s.who}</b>: "${s.say}"`;
  document.getElementById("slideNo").textContent = `${deck.i + 1} / ${deck.slides.length}`;
  document.querySelectorAll(".dthumbs button").forEach((b, j) => b.setAttribute("aria-current", String(j === deck.i)));
}
function mountDeck(root) {
  deck.slides = buildDeck(); deck.i = 0; stopDeck();
  const files = weak("rules") ? "📁 3조_최종.pptx · 3조_최종_진짜.pptx · 3조_최종_진짜(2).pptx ← 어느 게 최신?" : "📁 3조_발표.pptx";
  root.innerHTML = `
    <div class="filebar${weak("rules") ? " bad" : ""}">${files}</div>
    <div id="slideView"></div>
    <div class="bugs" id="bugs"></div>
    <div class="speech" id="speech"></div>
    <div class="dctl"><button type="button" id="dPrev">◀</button><button type="button" id="dPlay">▶ 발표 재생</button>
      <span class="n" id="slideNo"></span><button type="button" id="dNext">▶▶</button></div>
    <div class="dthumbs">${deck.slides.map((s, j) => `<button type="button" class="${s.bugs.length ? "has-bug" : ""}" data-j="${j}">${s.kind === "qa" ? "Q&A" : j + 1}</button>`).join("")}</div>`;
  root.querySelector("#dPrev").onclick = () => { stopDeck(); setPlay(); showSlide(deck.i - 1); };
  root.querySelector("#dNext").onclick = () => { stopDeck(); setPlay(); showSlide(deck.i + 1); };
  root.querySelector("#dPlay").onclick = () => {
    if (deck.timer) { stopDeck(); setPlay(); return; }
    if (deck.i === deck.slides.length - 1) showSlide(0);
    deck.timer = setInterval(() => { if (deck.i === deck.slides.length - 1) { stopDeck(); setPlay(); return; } showSlide(deck.i + 1); }, 3200 * state.speed);
    setPlay();
  };
  root.querySelectorAll(".dthumbs button").forEach((b) => (b.onclick = () => { stopDeck(); setPlay(); showSlide(+b.dataset.j); }));
  fitObserver.observe(root.querySelector("#slideView"));
  showSlide(0);
}
// 슬라이드는 360px 기준으로 그리고, 들어갈 칸 너비에 맞춰 확대·축소한다
const SLIDE_BASE = 360;
function fitSlide() {
  const box = document.getElementById("slideView"); if (!box) return;
  const sv = box.querySelector(".sv"); if (!sv) return;
  const scale = box.clientWidth / SLIDE_BASE;
  sv.style.transform = `scale(${scale})`;
  box.style.height = (SLIDE_BASE * 9 / 16) * scale + "px";
}
const fitObserver = new ResizeObserver(fitSlide);
function openModal() {
  const d = document.getElementById("deck"); if (!d) return;
  document.getElementById("mslot").append(d);
  document.getElementById("modal").hidden = false; fitSlide();
  document.getElementById("modalClose").focus();
}
function closeModal() {
  const m = document.getElementById("modal"); if (m.hidden) return;
  const d = document.getElementById("deck"); const home = document.getElementById("deckHome");
  if (d && home) home.append(d);
  m.hidden = true; fitSlide();
  const b = document.getElementById("bigView"); if (b) b.focus();
}
document.getElementById("modalClose").onclick = closeModal;
document.getElementById("modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", (e) => {
  if (document.getElementById("modal").hidden) return;
  if (e.key === "Escape") closeModal();
  if (e.key === "ArrowRight") document.getElementById("dNext")?.click();
  if (e.key === "ArrowLeft") document.getElementById("dPrev")?.click();
});
function setPlay() { const b = document.getElementById("dPlay"); if (b) b.textContent = deck.timer ? "⏸ 정지" : "▶ 발표 재생"; }

function pickEnding() {
  if (KEYS.every((k) => state.scores[k] >= TEAM_LINE)) return "team";
  return KEYS.reduce((lo, k) => (state.scores[k] < state.scores[lo] ? k : lo), KEYS[0]);
}
// 조건마다: 무너졌나/아슬아슬/지켜졌나 + 그 조건을 움직인 내 말
function failList() {
  return KEYS.map((k) => {
    const c = CONDITIONS[k]; const sp = SPOTS[k]; const v = state.scores[k];
    const level = v < WEAK_LINE ? "bad" : v < TEAM_LINE ? "mid" : "good";
    const mark = { bad: "❌ 무너짐", mid: "⚠️ 아슬아슬", good: "✅ 지켜짐" }[level];
    const what = level === "bad" ? (typeof sp.bad === "function" ? sp.bad() : sp.bad) : level === "good" ? sp.good : "슬라이드는 버텼지만 팀이라 하기엔 부족했다";
    const causes = state.history.filter((h) => h.diff[k] !== 0)
      .map((h) => `${h.ev.day} "${short(h.text)}" (${h.diff[k] > 0 ? "+" : ""}${h.diff[k]})`).join("<br>");
    return `<li class="${level}"><b style="color:${c.color}">${c.name}</b> ${mark} · ${sp.where}<br>${what}
      <span class="cause">← ${causes || "이 조건을 움직인 선택이 없었다"}</span></li>`;
  }).join("");
}

function showResult() {
  state.finished = true; renderTimeline(); renderPanel(null);
  const key = pickEnding(); const e = ENDINGS[key];
  addDay("D-day", "발표");
  const badgeColor = key === "team" ? "var(--good)" : CONDITIONS[key].color;
  const badge = key === "team" ? "엔딩: 팀이 됐다" : `엔딩: ${CONDITIONS[key].name}이 가장 크게 무너졌다`;
  const bars = KEYS.map((k) => `<div class="row"><span>${CONDITIONS[k].name}</span>
    <div class="bar"><div class="fill" style="width:${state.scores[k]}%;background:${CONDITIONS[k].color}"></div></div><b>${state.scores[k]}</b></div>`).join("");
  const links = LINKS.filter((l) => l.when(state)).map((l) => {
    const text = typeof l.text === "function" ? l.text() : l.text;
    return `<li class="${l.good ? "good" : "bad"}">${text}<div class="muted">${l.conds.map((k) => CONDITIONS[k].name).join(" → ")}</div></li>`;
  }).join("");

  const card = el("div", "card");
  card.innerHTML = `
    <span class="badge" style="background:${badgeColor}">${badge}</span>
    <h2>${e.title}</h2>
    <p>${e.scene}</p>
    <h3>3조의 발표 (빨간 점 = 무너진 슬라이드)</h3>
    <div id="deckHome"><div class="deck" id="deck"></div></div>
    <button type="button" class="bigview" id="bigView">큰 화면으로 발표 보기</button>
    <h3>${key === "team" ? "네 조건이 발표에서 어떻게 지켜졌나" : "어디서, 왜 무너졌나"}</h3>
    <ul class="fails">${failList()}</ul>
    ${links ? `<h3>조건끼리도 이어져 있었다</h3><ul class="links">${links}</ul>` : ""}
    <h3>최종 네 조건</h3>
    <div class="final-bars">${bars}</div>
    <h3>강의에서는</h3>
    <p>${e.lecture}</p>
    <p class="muted">3조는 가상의 조이고, 슬라이드 속 수치도 가상입니다. 결과는 선택에 따른 예시일 뿐 실제 성과를 예측하지 않습니다.</p>`;
  $chat.append(card);
  mountDeck(card.querySelector("#deck"));
  card.querySelector("#bigView").onclick = openModal;
  requestAnimationFrame(() => card.scrollIntoView({ block: "start" }));
  const again = el("button", "primary", "다시 하기"); again.type = "button"; again.onclick = showStart;
  setChoices([again]);
}

/* =========================================================
   7. 시작
   ========================================================= */
document.querySelectorAll("[data-speed]").forEach((b) => b.addEventListener("click", () => {
  state.speed = parseFloat(b.dataset.speed);
  document.querySelectorAll("[data-speed]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
}));
document.getElementById("gaugeToggle").addEventListener("click", (ev) => {
  const on = ev.currentTarget.getAttribute("aria-pressed") !== "true";
  ev.currentTarget.setAttribute("aria-pressed", String(on));
  $gauges.classList.toggle("show", on);
});
showStart();
</script>
